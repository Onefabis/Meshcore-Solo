; Solo build for ProMicro (nRF52840) -- extends the board base defined in
; variants/promicro/platformio.ini. Solo configs live in their own top-level
; solo/ folder, separate from the shared upstream board variants in variants/,
; so this repo's Solo-specific additions don't get mixed in with configs
; other MeshCore forks/upstream also carry.
;
; Full on-device UI, with CardKB support: CardKB shares the board's primary
; I2C bus (already used by the OLED display / RTC) instead of a dedicated
; second bus -- the default Wire1 pins on this variant (D13/D14) physically
; collide with the LoRa SPI bus (P_LORA_NSS=13, P_LORA_MOSI=14), and no other
; free GPIO pair is broken out on this board for a second dedicated bus. Do
; NOT define ENV_PIN_SDA/ENV_PIN_SCL here -- that would bring up a real Wire1
; on the colliding pins instead.
[env:ProMicro_companion_solo_dual]
extends = Promicro
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
; -Ofast (the core's default) doesn't fit a feature-complete solo build;
; -Os fits with headroom.
; Keep this production profile conservative. The offline queue is deliberately
; 128 frames: 256 x 177 B leaves too little heap for the on-device UI and
; transient signing/serialization buffers on the nRF52840.
build_unflags = -Ofast -D OFFLINE_QUEUE_SIZE=256
build_flags = ${Promicro.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D DUAL_SERIAL=1
  -D OFFLINE_QUEUE_SIZE=128
  -D DISPLAY_CLASS=SSD1306Display
  -D FIRMWARE_SOLO_BUILD=1
  -D UI_SENSORS_PAGE=1
  -D OLED_MISC_FIXED_FONT=1   ; full Latin/Greek/Cyrillic 6x9 font, ~14 KB flash
  -D ENABLE_SCREENSHOT
  -Os
  ; CardKB on the shared primary bus (D8=SDA / D7=SCL on this board).
  -D CARDKB_I2C=Wire
  -D UI_HAS_ROTARY_INPUT=1
  -D ROTARY_ENCODER_REVERSE=1
  -D ROTARY_ENCODER_DOUBLE_CLICK_MS=280
  -D HAS_DRV2605=1
;  -D MESH_PACKET_LOGGING=1
build_src_filter = ${Promicro.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/DRV2605Vibration.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Promicro.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit DRV2605 Library @ ^1.2.4

; Temporary diagnostics for the OLED/CardKB/encoder build. Select this
; environment only while collecting serial logs. The smaller queue protects
; the heap from printf/diagnostic stack and formatting overhead.
[env:ProMicro_companion_solo_dual_diag]
extends = ProMicro_companion_solo_dual
build_flags =
  ${env:ProMicro_companion_solo_dual.build_flags}
  -D MESH_DEBUG=1

; Experimental full-queue profile for the OLED build. Use only after a
; stress test on the target board confirms that the larger queue is stable.
[env:ProMicro_companion_solo_dual_queue256]
extends = ProMicro_companion_solo_dual
build_unflags =
  ${env:ProMicro_companion_solo_dual.build_unflags}
  -D OFFLINE_QUEUE_SIZE=128
build_flags =
  ${env:ProMicro_companion_solo_dual.build_flags}
  -D OFFLINE_QUEUE_SIZE=256

; Full Solo UI on a 280x240 ST7789V in landscape orientation.
; Display wiring: CS=D19, RST=D3, BL=D4 (P0.22), DC=D9, SCK=D18, MOSI=D20.
[env:ProMicro_companion_solo_st7789v]
extends = Promicro
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
; Keep this production profile conservative. The offline queue is deliberately
; 128 frames: 256 x 177 B leaves too little heap for the on-device UI and
; transient signing/serialization buffers on the nRF52840.
build_unflags = -Ofast -D ENV_INCLUDE_GPS=1 -D OFFLINE_QUEUE_SIZE=256
build_flags = ${Promicro.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D DUAL_SERIAL=1
  -D OFFLINE_QUEUE_SIZE=240
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D ST7789
  -D OLED_MISC_FIXED_FONT=1
  -D FIRMWARE_SOLO_BUILD=1
  -D UI_SENSORS_PAGE=1
  ;-D ENABLE_SCREENSHOT
  -D DISPLAY_ROTATION=1
  -D DISPLAY_WIDTH=240
  -D DISPLAY_HEIGHT=280
  -D DISPLAY_MARGIN_X=9
  -D DISPLAY_MARGIN_Y=8
  -D DISPLAY_LOGICAL_WIDTH=130
  -D DISPLAY_LOGICAL_HEIGHT=111
  -D DISPLAY_SCALE_X=2.0f
  -D DISPLAY_SCALE_Y=2.0f
  -D DISPLAY_INVERT_COLORS=1
  -D PIN_TFT_LEDA_CTL=4
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D DISPLAY_BRIGHTNESS_MIN=64
  -D DISPLAY_SPI_SPEED=32000000UL
  ; SPI1 uses nRF52840 SPIM3 at 32 MHz; the radio remains on SPI/SPIM2.
  -D SPI_32MHZ_INTERFACE=1
  -D ENV_INCLUDE_GPS=0
  -D CARDKB_I2C=Wire
  -D UI_HAS_ROTARY_INPUT=1
  -D ROTARY_ENCODER_REVERSE=0
  -D ROTARY_ENCODER_DOUBLE_CLICK_MS=280
  -D HAS_DRV2605=1
  -Os
build_src_filter = ${Promicro.build_src_filter}
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/ui/DRV2605Vibration.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${Promicro.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit GFX Library @ ^1.12.1
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
  adafruit/Adafruit DRV2605 Library @ ^1.2.4

; Temporary diagnostics for the ST7789/CardKB/encoder build. Select this
; environment only while collecting serial logs; it keeps the queue at 128.
[env:ProMicro_companion_solo_st7789v_diag]
extends = ProMicro_companion_solo_st7789v
build_flags =
  ${env:ProMicro_companion_solo_st7789v.build_flags}
  -D MESH_DEBUG=1

; Experimental full-queue profile. This restores the upstream 256-frame queue
; after diagnostics are disabled, but is not recommended unless a build-size
; and runtime stress test confirms sufficient heap on the target board.
[env:ProMicro_companion_solo_st7789v_queue256]
extends = ProMicro_companion_solo_st7789v
build_unflags =
  ${env:ProMicro_companion_solo_st7789v.build_unflags}
  -D OFFLINE_QUEUE_SIZE=128
build_flags =
  ${env:ProMicro_companion_solo_st7789v.build_flags}
  -D OFFLINE_QUEUE_SIZE=256
